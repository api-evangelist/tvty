name: TVTY
description: 'TVTY is an advertising technology company that bridges television and
  digital advertising through its Moment Marketing platform. Its TV Ad Alert technology
  detects when a brand or competitor TV spot airs and synchronizes digital media campaigns
  — search, social, display and marketplace advertising — to those moments so advertisers
  reach audiences at the point of highest attention. TVTY was a Partech portfolio
  company serving global brands and media agencies. The company, headquartered in
  Paris, was acquired by Nielsen in July 2021 and folded into Nielsen''s TV attribution
  and ad intelligence business; the tvty.tv site stopped serving after mid-2023 and the
  host no longer responds, so TVTY has no independent developer surface today.'
